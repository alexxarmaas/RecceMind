[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501", # Long validation messages remain more readable on one line.
  "B008", # FastAPI dependencies are intentionally declared in signatures.
  "B905", # Pairwise coordinate iteration intentionally uses overlapping slices.
]
